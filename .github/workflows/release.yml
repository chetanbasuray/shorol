name: Release

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

# Serialize releases so two merges in quick succession cannot publish concurrently.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@11.5.1
      - run: npm ci
      # Self-gate the automated release: no human reviews the merge, so a failing
      # test or typecheck must stop the publish.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
